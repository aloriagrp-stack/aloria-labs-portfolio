<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Scraper Auditor | Aloria Labs - Strategy Tools</title>
  <link rel="stylesheet" href="/src/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="tool-page">
  <header id="header" class="scrolled">
    <div class="container nav-wrapper">
      <a href="/" class="logo">
        <span class="logo-text">ALORIA <span class="accent">LABS</span></span>
      </a>
      <a href="/" class="btn btn-outline">Back to Hub</a>
    </div>
  </header>

  <main style="padding-top: 120px;">
    <div class="container">
      <div id="quiz-container" class="tool-wrapper card-glass" style="max-width: 600px; margin: 0 auto; padding: 60px;">
        <p class="section-tag-mini hacker-text">Diagnostic Tool 02</p>
        <h1 class="gradient-text">Lead Scraper <span style="color:#fff">Auditor</span></h1>
        
        <div id="q1">
            <h3 style="margin: 30px 0;">What is your target industry?</h3>
            <div style="display:flex; flex-direction:column; gap:15px;">
                <button onclick="next(1, 40)" class="btn btn-outline" style="text-align:left;">Real Estate / PropTech</button>
                <button onclick="next(1, 30)" class="btn btn-outline" style="text-align:left;">B2B / SaaS / Agency</button>
                <button onclick="next(1, 20)" class="btn btn-outline" style="text-align:left;">Healthcare / Clinics</button>
                <button onclick="next(1, 10)" class="btn btn-outline" style="text-align:left;">Local Retail / Services</button>
            </div>
        </div>

        <div id="q2" style="display:none;">
            <h3 style="margin: 30px 0;">How many leads do you need per month?</h3>
            <div style="display:flex; flex-direction:column; gap:15px;">
                <button onclick="next(2, 50)" class="btn btn-outline" style="text-align:left;">10,000+ (Extreme Volume)</button>
                <button onclick="next(2, 40)" class="btn btn-outline" style="text-align:left;">1,000 - 5,000 (Standard)</button>
                <button onclick="next(2, 20)" class="btn btn-outline" style="text-align:left;">Under 500 (Niche)</button>
            </div>
        </div>

        <div id="result" style="display:none; text-align:center;">
            <p class="section-tag-mini">Your Audit Result</p>
            <h2 id="score-text" style="font-size: 3rem; margin: 20px 0;">90% Feasible</h2>
            <p id="desc" style="color:var(--text-muted); margin-bottom: 30px;">Your niche is perfect for autonomous scraping. You can expect a 5x increase in lead velocity.</p>
            <a id="wa-final" href="#" class="btn btn-primary" style="width:100%;">Get Your Custom Extraction Plan <i data-lucide="arrow-right"></i></a>
        </div>
      </div>
    </div>
  </main>

  <script>
    let totalScore = 0;
    function next(current, score) {
        totalScore += score;
        document.getElementById('q' + current).style.display = 'none';
        if(current < 2) {
            document.getElementById('q' + (current + 1)).style.display = 'block';
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('result').style.display = 'block';
        const resText = document.getElementById('score-text');
        const desc = document.getElementById('desc');
        const wa = document.getElementById('wa-final');
        
        if(totalScore >= 80) {
            resText.innerText = "95% High Feasibility";
            desc.innerText = "Excellent. Your niche has high public data availability. Our AI can extract these leads with 99% accuracy.";
        } else if(totalScore >= 50) {
            resText.innerText = "70% Moderate Feasibility";
            desc.innerText = "Good. There are some technical hurdles, but our custom scrapers can overcome them for stable lead flow.";
        } else {
            resText.innerText = "40% Low Feasibility";
            desc.innerText = "Manual search might still be needed, but we can automate the research phase to save you 40% time.";
        }
        
        wa.href = `https://wa.me/919318485680?text=I ran the Lead Scraper Auditor and got ${resText.innerText}. I'd like to discuss an extraction plan.`;
    }

    window.addEventListener('DOMContentLoaded', () => { if (window.lucide) window.lucide.createIcons(); });
  </script>
</body>
</html>
