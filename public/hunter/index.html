<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALORIA'S</title>
  <style>
    :root {
      --bg: #090a0d;
      --card-top: #181b20;
      --card-bottom: #111317;
      --card-border: #232730;
      --card-highlight: rgba(255, 255, 255, 0.12);
      
      --well-bg: #060709;
      --well-border: #1a1c22;
      
      --text-white: #ffffff;
      --text-silver: #d1d5db;
      --text-muted: #808a9d;
      --text-dim: #4f5869;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      background-color: var(--bg);
      color: var(--text-silver);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.4;
      background-image: linear-gradient(180deg, #0e1015 0%, #060709 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mono {
      font-family: var(--font-mono);
    }

    .empire-portal-container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 18px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    .empire-hero-header {
      text-align: center;
    }

    .empire-main-title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--text-white);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    @media (max-width: 600px) {
      .empire-main-title {
        font-size: 34px;
        letter-spacing: 0.08em;
      }
    }

    .empires-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .empires-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }

    .empire-tile {
      background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
      border: 1px solid var(--card-border);
      border-top: 1px solid var(--card-highlight);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 20px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .empire-tile:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.9);
    }

    .empire-tile:active {
      transform: scale(0.98);
    }

    .empire-tile-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-white);
    }

    .empire-preview-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--well-bg);
      border: 1px solid var(--well-border);
      border-radius: 12px;
      padding: 12px;
    }

    .empire-stat-mini {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-mini-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
    }

    .stat-mini-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-white);
    }

    .empire-enter-btn {
      width: 100%;
      background: linear-gradient(180deg, #252a34, #151820);
      border: 1px solid var(--card-border);
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-white);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      transition: all 0.15s ease;
    }

    .empire-tile:hover .empire-enter-btn {
      background: linear-gradient(180deg, #2f3542, #1a1e27);
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="empire-portal-container">
    
    <div class="empire-hero-header">
      <h1 class="empire-main-title">ALORIA'S</h1>
    </div>

    <div class="empires-grid">
      
      <!-- EMPIRE 1: GETHOTELSTAYS -->
      <a class="empire-tile" href="gethotelstays.html">
        <h2 class="empire-tile-name">GETHOTELSTAYS</h2>
        <div class="empire-preview-stats">
          <div class="empire-stat-mini">
            <span class="stat-mini-label">Dispatched</span>
            <span class="stat-mini-val mono" id="portal-ghs-sent">--</span>
          </div>
          <div class="empire-stat-mini">
            <span class="stat-mini-label">Inboxes</span>
            <span class="stat-mini-val mono">11 Active</span>
          </div>
          <div class="empire-stat-mini">
            <span class="stat-mini-label">Engine</span>
            <span class="stat-mini-val mono" id="portal-ghs-status" style="color: var(--text-dim);">OFFLINE</span>
          </div>
        </div>
        <div class="empire-enter-btn">
          Enter GetHotelStays Cockpit &rarr;
        </div>
      </a>

      <!-- EMPIRE 2: ALORIA LABS -->
      <a class="empire-tile" href="alorialabs.html">
        <h2 class="empire-tile-name">ALORIA LABS</h2>
        <div class="empire-preview-stats">
          <div class="empire-stat-mini">
            <span class="stat-mini-label">Dispatched</span>
            <span class="stat-mini-val mono" id="portal-aloria-sent">--</span>
          </div>
          <div class="empire-stat-mini">
            <span class="stat-mini-label">Inboxes</span>
            <span class="stat-mini-val mono">1 Active</span>
          </div>
          <div class="empire-stat-mini">
            <span class="stat-mini-label">Engine</span>
            <span class="stat-mini-val mono" id="portal-aloria-status" style="color: var(--text-dim);">OFFLINE</span>
          </div>
        </div>
        <div class="empire-enter-btn">
          Enter Aloria Labs Cockpit &rarr;
        </div>
      </a>

    </div>

  </div>

  <script>
    const API_BASE = window.location.port === '5173' ? 'http://localhost:8000' : '';

    async function fetchPortalPreviews() {
      try {
        const [resGhs, resAloria] = await Promise.all([
          fetch(`${API_BASE}/api/dashboard/stats?business_id=gethotelstays`),
          fetch(`${API_BASE}/api/dashboard/stats?business_id=aloria_labs`)
        ]);
        if (resGhs.ok) {
          const dGhs = await resGhs.json();
          const el = document.getElementById('portal-ghs-sent');
          if (el) el.innerText = (dGhs.total_all_time_emails || 0).toLocaleString();
          const stEl = document.getElementById('portal-ghs-status');
          if (stEl) {
            const isOnline = Boolean(dGhs.is_active || (dGhs.hotel_status && dGhs.hotel_status !== 'OFFLINE' && dGhs.hotel_status !== 'IDLE'));
            stEl.innerText = isOnline ? 'ONLINE' : 'OFFLINE';
            stEl.style.color = isOnline ? '#ffffff' : 'var(--text-dim)';
          }
        }
        if (resAloria.ok) {
          const dAloria = await resAloria.json();
          const el = document.getElementById('portal-aloria-sent');
          if (el) el.innerText = (dAloria.total_all_time_emails || 0).toLocaleString();
          const stEl = document.getElementById('portal-aloria-status');
          if (stEl) {
            const isOnline = Boolean(dAloria.is_active || (dAloria.aloria_status && dAloria.aloria_status !== 'OFFLINE' && dAloria.aloria_status !== 'IDLE'));
            stEl.innerText = isOnline ? 'ONLINE' : 'OFFLINE';
            stEl.style.color = isOnline ? '#ffffff' : 'var(--text-dim)';
          }
        }
      } catch (e) {}
    }

    fetchPortalPreviews();
    setInterval(() => {
      if (document.visibilityState === 'visible') fetchPortalPreviews();
    }, 4000);
  </script>
</body>
</html>
