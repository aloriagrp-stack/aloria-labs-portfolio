<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C:\Windows\system32\cmd.exe</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: Consolas, 'Lucida Console', 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #000000;
      color: #cccccc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .cmd-window {
      width: 100vw;
      min-height: 100vh;
      background: #0c0c0c;
      display: flex;
      flex-direction: column;
    }
    /* Windows cmd.exe Title Bar */
    .cmd-title-bar {
      background: #1f1f1f;
      height: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      user-select: none;
      border-bottom: 1px solid #333333;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .cmd-title-text {
      color: #ffffff;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cmd-icon {
      width: 15px;
      height: 15px;
      background: #0c0c0c;
      border: 1px solid #777;
      color: #fff;
      font-size: 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cmd-buttons {
      display: flex;
      height: 100%;
    }
    .cmd-btn {
      width: 44px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
    }
    .cmd-btn:hover { background: #333333; }
    .cmd-btn.close:hover { background: #e81123; }

    /* Terminal Screen Body */
    .terminal-screen {
      flex: 1;
      padding: 12px 16px;
      font-size: 13.5px;
      line-height: 1.42;
      color: #cccccc;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
    }

    /* Authentic ANSI Colors */
    .c-magenta { color: #d845e2; font-weight: bold; }
    .c-cyan    { color: #00e5ff; }
    .c-green   { color: #00ff66; }
    .c-yellow  { color: #ffff00; }
    .c-red     { color: #ff3333; }
    .c-white   { color: #ffffff; font-weight: bold; }
    .c-dim     { color: #767676; }
    .c-blue    { color: #3b82f6; }
    .bg-cyan   { background: #00e5ff; color: #000000; font-weight: bold; padding: 1px 4px; }
    .bg-red    { background: #c50f1f; color: #ffffff; font-weight: bold; padding: 2px 6px; }

    .clickable-row {
      cursor: pointer;
      display: block;
      padding: 2px 0;
      border-radius: 2px;
    }
    .clickable-row:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    /* Interactive input prompt */
    .prompt-container {
      padding: 10px 16px;
      background: #0c0c0c;
      border-top: 1px solid #1a1a1a;
      position: sticky;
      bottom: 48px;
    }
    .prompt-row {
      display: flex;
      align-items: center;
      font-size: 14px;
    }
    .prompt-label {
      color: #00ff66;
      font-weight: bold;
      margin-right: 8px;
      white-space: nowrap;
    }
    .terminal-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      flex: 1;
      caret-color: #00ff66;
    }
    .cursor-block {
      display: inline-block;
      width: 9px;
      height: 15px;
      background: #00ff66;
      vertical-align: middle;
      animation: blink 1s step-start infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Mobile Quick Dock */
    .mobile-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 14px;
      background: #141414;
      border-top: 1px solid #282828;
      position: sticky;
      bottom: 0;
      z-index: 99;
    }
    .m-key {
      background: #1e1e1e;
      color: #00e5ff;
      border: 1px solid #333333;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .m-key:active { background: #00e5ff; color: #000; }
    .m-key.primary { color: #00ff66; border-color: #00ff66; font-weight: bold; }
    .m-key.warn { color: #ffff00; }
    .m-key.danger { color: #ff3333; }
  </style>
</head>

            "Authorization": `Bearer ${TOKEN}`

        };

        const r = await fetch(url, opt);
        return await r.json();
      } catch (e) {
        return null;
      }

          params: { country: targetCountry, city: targetCity, niche: targetNiche, goal: targetGoal }

          const launchRes = await req("/api/agent/launch", "POST", {
            business_id: activeEmpire,
            country: targetCountry,
            city: targetCity,
            niche: targetNiche,
            limit: targetGoal,
            action: "full_wave"
          });
          if (launchRes && launchRes.message) {
            appendLog(`[AGENT STATUS] ${launchRes.message}`, "c-green");
          }
          startPollingLogs();
        }

        setTimeout(renderDashboard, 1500);
      }

    async function handleKey(key) {
      key = key.trim().toLowerCase();
      inp.value = "";

      if (wizardStep > 0) {
        handleWizardInput(key);
        return;

      if (key === "1") {
        if (!isRunning) {
          // Ask user where & how many leads before running!
          startTargetWizard("hunt");

          appendLog(`[!] Halting 24/7 Swarm Engine...`, "c-yellow");
          isRunning = false;
          await req("/api/autopilot/stop", "POST", { business_id: activeEmpire });
          appendLog(`[✓] Swarm Engine safely paused.`, "c-red");

        }
      }
      else if (key === "t") {
        // Operator explicitly wants to configure destination & leads
        startTargetWizard("target_only");
      }
      else if (key === "a") {
        appendLog(`[AI CLOSER] Connecting IMAP & auto-negotiating inbound replies...`, "c-cyan");
        const res = await req("/api/action", "POST", { action: "run_closer", business_id: activeEmpire });
        if (res && res.closed_count !== undefined) {
          appendLog(`[✓ CLOSER COMPLETE] Closed ${res.closed_count} threads with booking/proposal link.`, "c-green");
        } else {
          appendLog(`[✓ CLOSER] Scan completed. Inboxes checked.`, "c-green");
        }
        setTimeout(renderDashboard, 1500);
      }
      else if (key === "f") {
        appendLog(`[PRIORITY FOLLOW-UPS] Dispatching scheduled follow-ups to warm leads...`, "c-yellow");
        await req("/api/followup/run", "POST");
        appendLog(`[✓ COMPLETE] Warm follow-ups processed.`, "c-green");
        setTimeout(renderDashboard, 1500);
      }
      else if (key === "c") {
        appendLog(`[SCAN BOUNCES] Scanning inboxes for delivery failure notifications...`, "c-magenta");
        await req("/api/bounces/scan", "POST");
        appendLog(`[✓ COMPLETE] Dead inboxes blacklisted automatically.`, "c-green");
        setTimeout(renderDashboard, 1500);
      }
      else if (key === "l") {
        appendLog(`[LEDGER] Opening live leads ledger...`, "c-yellow");
        const leads = await req(`/api/leads?business_id=${activeEmpire}`) || [];
        appendLog(`─── RECENT 10 RECORDED LEADS ───`, "c-cyan");
        leads.slice(0, 10).forEach((l, i) => {
          appendLog(`#${i+1}: ${l.business_name} | ${l.email || 'No email'} | Status: ${l.status}`, "c-white");
        });
      }
      else if (key === "b") {
        activeEmpire = (activeEmpire === "aloria_labs") ? "gethotelstays" : "aloria_labs";
        if (activeEmpire === "aloria_labs") {
          targetCountry = "USA"; targetCity = "Miami, FL"; targetNiche = "MedSpas & Aesthetic Clinics"; targetGoal = 50;
        } else {
          targetCountry = "India"; targetCity = "Goa"; targetNiche = "Hotels"; targetGoal = 100;
        }
        appendLog(`[SWITCH] Active Profile changed to: ${activeEmpire.toUpperCase()}`, "c-cyan");
        await req("/api/action", "POST", { action: "switch_business", business_id: activeEmpire });
        renderDashboard();
      }
      else if (key === "0") {
        appendLog(`[STOPPED] Halting Swarm processes...`, "c-red");
        await req("/api/autopilot/stop", "POST");
        isRunning = false;
        setTimeout(renderDashboard, 1000);
      }
      else {
        appendLog(`Command not recognized: '${key}'. Type 1, T, A, F, C, L, B, or 0.`, "c-red");
      }
    }

    let pollInterval = null;
    let seenLogIds = new Set();

    function startPollingLogs() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        const logs = await req(`/api/logs?limit=8&business_id=${activeEmpire}`);
        if (Array.isArray(logs)) {
          logs.reverse().forEach(log => {
            const key = log.id || `${log.business_name}_${log.timestamp}`;
            if (!seenLogIds.has(key)) {
              seenLogIds.add(key);
              appendLog(`[DISPATCH] Sent to ${log.business_name || log.email} (${log.subject || 'Outreach'})`, "c-green");
            }
          });
        }
      }, 4000);
    }

    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        handleKey(inp.value);
      }
    });

    document.addEventListener("click", () => inp.focus());

    // Initial render
    renderDashboard();
    setInterval(renderDashboard, 8000);
  </script>
</body>
</html>
