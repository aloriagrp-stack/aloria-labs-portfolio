<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aloria Hunter — Autonomous Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.4);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --dim: #4b5563;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
    }
    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--green);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    /* Profile Selector Pills */
    .profile-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0,0,0,0.3);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .profile-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .profile-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    /* Metrics Row */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }
    /* Main Control Box */
    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      backdrop-filter: blur(12px);
    }
    .target-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 12px;
    }
    .target-val {
      color: #fff;
      font-weight: 600;
    }
    .main-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 18px var(--green-glow);
    }
    .main-btn.running {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.25);
    }
    .main-btn:active {
      transform: scale(0.98);
    }
    .sub-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sub-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sub-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
    }
    /* Terminal Console */
    .terminal-card {
      background: #06070a;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .terminal-body {
      height: 220px;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .terminal-line {
      word-break: break-all;
    }
    .terminal-line.success { color: #34d399; }
    .terminal-line.warn { color: #fbbf24; }
    .terminal-line.accent { color: #818cf8; }
    .terminal-line.dim { color: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <header>
      <div class="brand">
        <div class="logo-badge">A</div>
        <div class="brand-title">Aloria Hunter</div>
      </div>
      <div class="live-pill">
        <div class="pulse-dot"></div>
        <span id="system-status">24/7 ONLINE</span>
      </div>
    </header>

    <!-- Profile Switcher -->
    <div class="profile-switch">
      <button class="profile-btn active" id="btn-aloria" onclick="switchProfile('aloria_labs')">
        🇺🇸 Aloria Labs (USA)
      </button>
      <button class="profile-btn" id="btn-ghs" onclick="switchProfile('gethotelstays')">
        🏨 GetHotelStays
      </button>
    </div>

    <!-- 3 Core Minimal Metrics -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Delivered Today</div>
        <div class="stat-val" id="stat-delivered">0 / 200</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Volume</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Inbound Replies</div>
        <div class="stat-val" id="stat-replies">0</div>
      </div>
    </div>

    <!-- Main Controller -->
    <div class="control-card">
      <div class="target-banner">
        <span>Active Focus</span>
        <span class="target-val" id="target-display">USA • Miami, FL • MedSpas</span>
      </div>

      <button class="main-btn" id="toggle-swarm-btn" onclick="toggleSwarm()">
        ▶ START 24/7 AUTONOMOUS SWARM
      </button>

      <div class="sub-actions">
        <button class="sub-btn" onclick="triggerAction('wave')">⚡ Run 1-Click Wave</button>
        <button class="sub-btn" onclick="triggerAction('closer')">🤖 AI Closer Sync</button>
      </div>
    </div>

    <!-- Minimal Terminal Feed -->
    <div class="terminal-card">
      <div class="terminal-header">
        <span>LIVE EXECUTION STREAM</span>
        <span id="log-count">0 events</span>
      </div>
      <div class="terminal-body" id="terminal-feed">
        <div class="terminal-line dim">[System] Connected to Aloria Cloud Daemon.</div>
        <div class="terminal-line success">[Ready] All 4 sender accounts authenticated.</div>
      </div>
    </div>
  </div>

  <script>
    const AUTH_TOKEN = "aloria_master_shriyansh0402";
    let activeBiz = "aloria_labs";
    let isRunning = false;

    async function apiFetch(endpoint, method = "GET", body = null) {
      try {
        const options = {
          method,
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${AUTH_TOKEN}`
          }
        };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(endpoint, options);
        return await res.json();
      } catch (e) {
        console.error("API Error:", e);
        return null;
      }
    }

    async function switchProfile(bizId) {
      activeBiz = bizId;
      document.getElementById('btn-aloria').classList.toggle('active', bizId === 'aloria_labs');
      document.getElementById('btn-ghs').classList.toggle('active', bizId === 'gethotelstays');
      
      logToTerminal(`[Profile] Switched active empire to: ${bizId.toUpperCase()}`, 'accent');
      await apiFetch('/api/action', 'POST', { action: 'switch_business', business_id: bizId });
      refreshDashboard();
    }

    async function refreshDashboard() {
      const data = await apiFetch('/api/status');
      if (!data) return;

      if (data.active_business_id) {
        activeBiz = data.active_business_id;
        document.getElementById('btn-aloria').classList.toggle('active', activeBiz === 'aloria_labs');
        document.getElementById('btn-ghs').classList.toggle('active', activeBiz === 'gethotelstays');
      }

      // Update Target Display
      if (activeBiz === 'aloria_labs') {
        document.getElementById('target-display').innerText = "USA • Miami, FL • MedSpas & Web Sales";
      } else {
        document.getElementById('target-display').innerText = "UAE / India • Dubai • Hotels";
      }

      // Update Metrics
      const deliveredToday = data.delivered_today || 0;
      const dailyCap = data.daily_cap || 200;
      document.getElementById('stat-delivered').innerText = `${deliveredToday} / ${dailyCap}`;
      document.getElementById('stat-total').innerText = data.total_outreach || data.total_leads || 0;
      document.getElementById('stat-replies').innerText = data.replies_count || data.replied || 0;

      // Update Swarm State
      isRunning = !!(data.autopilot_running || data.is_running);
      const btn = document.getElementById('toggle-swarm-btn');
      if (isRunning) {
        btn.innerText = "⏸ PAUSE AUTONOMOUS SWARM";
        btn.classList.add('running');
      } else {
        btn.innerText = "▶ START 24/7 AUTONOMOUS SWARM";
        btn.classList.remove('running');
      }
    }

    async function toggleSwarm() {
      const btn = document.getElementById('toggle-swarm-btn');
      if (!isRunning) {
        btn.innerText = "Starting...";
        await apiFetch('/api/autopilot/start', 'POST', { business_id: activeBiz });
        logToTerminal(`[Swarm] 🚀 24/7 Autonomous outreach loop launched!`, 'success');
        isRunning = true;
      } else {
        btn.innerText = "Pausing...";
        await apiFetch('/api/autopilot/stop', 'POST', { business_id: activeBiz });
        logToTerminal(`[Swarm] ⏸ Swarm paused by operator.`, 'warn');
        isRunning = false;
      }
      refreshDashboard();
    }

    async function triggerAction(actionType) {
      if (actionType === 'wave') {
        logToTerminal(`[Execution] Dispatching 1-Click Discovery & Outreach Wave...`, 'accent');
        await apiFetch('/api/action', 'POST', { action: 'hunt_wave', business_id: activeBiz });
      } else if (actionType === 'closer') {
        logToTerminal(`[AI Closer] Scanning inbound replies and auto-closing with booking link...`, 'accent');
        await apiFetch('/api/action', 'POST', { action: 'run_closer', business_id: activeBiz });
      }
      refreshDashboard();
    }

    function logToTerminal(text, type = 'normal') {
      const feed = document.getElementById('terminal-feed');
      const line = document.createElement('div');
      line.className = `terminal-line ${type}`;
      const now = new Date().toLocaleTimeString();
      line.innerText = `[${now}] ${text}`;
      feed.appendChild(line);
      feed.scrollTop = feed.scrollHeight;
    }

    async function pollLogs() {
      const logs = await apiFetch('/api/logs?limit=8');
      if (logs && Array.isArray(logs) && logs.length > 0) {
        const feed = document.getElementById('terminal-feed');
        // display top events
        document.getElementById('log-count').innerText = `${logs.length} logged`;
      }
    }

    // Auto-refresh every 3.5 seconds
    setInterval(refreshDashboard, 3500);
    setInterval(pollLogs, 6000);
    refreshDashboard();
  </script>
</body>
</html>
